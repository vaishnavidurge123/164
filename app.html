{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 80px; }
        h1 { font-size: 32px; }
        input, select, button { padding: 10px; font-size: 18px; margin: 5px; }
        button { cursor: pointer; }
        #result { font-size: 24px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Simple Calculator</h1>

    <input type="number" id="num1" placeholder="Enter first number" value="2">

    <select id="operation">
        <option value="add">Addition (+)</option>
        <option value="subtract">Subtraction (-)</option>
        <option value="multiply">Multiplication (*)</option>
        <option value="divide">Division (/)</option>
    </select>

    <input type="number" id="num2" placeholder="Enter second number" value="2">

    <br><br>
    <button onclick="calculate()">Calculate</button>
    <button onclick="clearAll()">Clear</button>

    <p id="result">Result: </p>

    <script>
        function calculate() {
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            let op = document.getElementById('operation').value;
            let res = 0;

            if (isNaN(n1) || isNaN(n2)) {
                document.getElementById('result').innerText = "Result: Please enter both numbers";
                return;
            }

            if (op === 'add') res = n1 + n2;
            if (op === 'subtract') res = n1 - n2;
            if (op === 'multiply') res = n1 * n2;
            if (op === 'divide') {
                if (n2 === 0) {
                    document.getElementById('result').innerText = "Result: Cannot divide by 0";
                    return;
                }
                res = n1 / n2;
            }

            document.getElementById('result').innerText = "Result: " + res;
        }

        function clearAll() {
            document.getElementById('num1').value = "";
            document.getElementById('num2').value = "";
            document.getElementById('result').innerText = "Result: ";
        }
    </script>

</body>
</html>
